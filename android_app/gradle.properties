android.useAndroidX=true

# Jetifier só é necessário para bibliotecas pré-AndroidX. A última que
# dependia disso (android.arch.lifecycle) foi substituída na migração para
# AGP 7, então desligar acelera o build. Se alguma lib antiga voltar a
# precisar, o erro aponta a classe android.support que faltou.
android.enableJetifier=false

# O build do AGP 7 com anotação de Room precisa de mais heap que o padrão.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AGP 7 usa configuração não-transitiva de R por padrão em projetos novos;
# aqui é declarado explicitamente para o comportamento não mudar sozinho
# numa futura atualização.
android.nonTransitiveRClass=false
